name: Dependabot auto-merge

# Mergt Dependabot-PRs, sobald die CI auf dem PR grün ist (auch Major-Updates).
# Ohne GitHub Pro gibt es für private Repos keine Pflicht-Checks, deshalb wartet
# dieser Workflow selbst auf den erfolgreichen CI-Lauf. Merges mit dem
# GITHUB_TOKEN lösen keine push-Workflows aus, darum wird das Deploy danach
# per workflow_dispatch angestoßen.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Mergen
        id: merge
        run: |
          set -euo pipefail
          pr=$(gh pr list --head "$BRANCH" --state open --json number,author \
            --jq '.[] | select(.author.login == "app/dependabot") | .number')
          if [ -z "$pr" ]; then
            echo "Kein offener Dependabot-PR für $BRANCH"
            exit 0
          fi
          gh pr merge "$pr" --squash --match-head-commit "$SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"
      # CI deployt main; braucht den workflow_dispatch-Trigger.
      - name: Deploy anstoßen
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run ci.yml --ref "$DEFAULT_BRANCH"
