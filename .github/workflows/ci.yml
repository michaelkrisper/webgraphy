name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal by default; the deploy job elevates its own permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git describe` sees version tags (app version).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test (with coverage thresholds)
        run: npx vitest run --coverage
      - name: Build
        run: npm run build
      - name: Size budget
        # Operates on the build produced above; gzipped bytes, per entry plus
        # the PWA precache total.
        run: node scripts/size-check.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Runs in the pinned Playwright container, not on the bare runner: screenshot
  # baselines depend on the exact browser build, font set and rasteriser, and
  # the image fixes all three. Baselines are generated here and committed —
  # never generated on a developer machine.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: End-to-end and visual regression
        run: npx playwright test
      - name: Upload report and any written snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/**/*-snapshots/
          retention-days: 7

  # Separate job so a noisy benchmark never blocks the deploy pipeline, and so
  # it runs concurrently with the quality gates rather than lengthening them.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark hot path against the baseline
        # Normalised against control workloads measured in the same run, so
        # results survive the spread between runner classes. Fails the build
        # only here: CI has a dedicated runner, developer machines do not.
        run: npm run bench:check
      - name: Upload raw benchmark result
        # Lets a clean baseline be regenerated from a run on an idle runner,
        # without measuring on a contended developer machine.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-result
          path: bench-result.json
          retention-days: 7

  deploy:
    # Only deploy a green build of main; reuses the artifact from quality.
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
