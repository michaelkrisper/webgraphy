name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal by default; the deploy job elevates its own permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git describe` sees version tags (app version).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test (with coverage thresholds)
        run: npx vitest run --coverage
      - name: Build
        run: npm run build
      - name: Size budget
        # Operates on the build produced above; gzipped bytes, per entry plus
        # the PWA precache total.
        run: node scripts/size-check.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Separate job so a noisy benchmark never blocks the deploy pipeline, and so
  # it runs concurrently with the quality gates rather than lengthening them.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark hot path against the baseline
        # Results are normalised against a control workload measured in the
        # same run, so they survive the spread between runner classes.
        run: npm run bench:check

  deploy:
    # Only deploy a green build of main; reuses the artifact from quality.
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
