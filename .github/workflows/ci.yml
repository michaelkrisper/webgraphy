name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate e2e screenshot baselines (uploaded as the e2e-snapshots artifact, not committed)"
        type: boolean
        default: false

# Nothing by default; every job declares the least it needs.
permissions: {}

# A newer push to a PR supersedes the older run. Runs of main (pushes and
# dispatches) share one group and are never cancelled: they compute the next
# version at the start and tag it at the end, so two of them must not overlap.
# GitHub keeps one pending run per group, so a third merge replaces a pending
# one; that commit gets no tag of its own but ships in the newer run's
# release. Manual dispatches of other branches get a per-run group.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and all tags: `git describe` (app version) and the
          # release version below both read the vX.Y.Z tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Release version
        # Every build of main gets a version: the next patch after the highest
        # tag, or the tag already on this commit (re-runs, or a release cut by
        # the Release workflow). Deploy tags it once Pages is live. Only the
        # tip of main is versioned: re-running an older run deploys nothing.
        id: version
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer the tip of main; this run neither tags nor deploys."
            exit 0
          fi
          version=$(node scripts/next-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: v$version" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test (with coverage thresholds)
        run: npx vitest run --coverage
      - name: Build
        # The release version, so the deployed bundle shows exactly the tag
        # it ships under. Empty off main: appVersion.ts uses git describe.
        # WEBMCP_OT_TOKEN (repository variable, optional) is the Chrome origin
        # trial token for WebMCP; Pages cannot send it as a header.
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_WEBMCP_OT_TOKEN: ${{ vars.WEBMCP_OT_TOKEN }}
        run: npm run build
      - name: Size budget
        # Operates on the build produced above; gzipped bytes, per entry plus
        # the PWA precache total.
        run: node scripts/size-check.mjs
      - name: Upload Pages artifact
        if: steps.version.outputs.version != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Runs in the pinned Playwright container, not on the bare runner: screenshot
  # baselines depend on the exact browser build, font set and rasteriser, and
  # the image fixes all three. Baselines are generated here and committed —
  # never generated on a developer machine. To refresh them, dispatch CI with
  # `update-snapshots` and commit the files from the e2e-snapshots artifact.
  #
  # Builds its own bundle rather than downloading quality's `dist`: needing
  # quality would start Playwright only after the coverage run, which costs
  # more wall time than the build it saves.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Must equal the exact @playwright/test version in package.json (pinned
      # without a caret); the step below fails fast when they drift, e.g. when
      # Dependabot bumps the package but cannot see this image tag.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Playwright package matches container image
        run: |
          pkg=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          img=$(sed -n 's|^ *image: mcr.microsoft.com/playwright:v\([^-]*\)-.*|\1|p' .github/workflows/ci.yml)
          if [ "$pkg" != "$img" ]; then
            echo "::error::@playwright/test is '$pkg' but the e2e container image is v$img; bump both to the same exact version."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: End-to-end and visual regression
        if: ${{ !inputs.update-snapshots }}
        run: npx playwright test
      - name: Regenerate screenshot baselines
        if: ${{ inputs.update-snapshots }}
        run: npx playwright test --update-snapshots=changed
      - name: Upload regenerated baselines
        if: ${{ always() && inputs.update-snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-snapshots
          path: e2e/**/*-snapshots/
          retention-days: 7
      - name: Upload report and any written snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/**/*-snapshots/
          retention-days: 7

  # Separate job so a noisy benchmark never blocks the deploy pipeline, and so
  # it runs concurrently with the quality gates rather than lengthening them.
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark hot path against the baseline
        # Normalised against control workloads measured in the same run, so
        # results survive the spread between runner classes. Fails the build
        # only here: CI has a dedicated runner, developer machines do not.
        run: npm run bench:check
      - name: Upload raw benchmark result
        # Lets a clean baseline be regenerated from a run on an idle runner,
        # without measuring on a contended developer machine.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: bench-result.json
          retention-days: 7

  deploy:
    # Only deploy a build of main that passed the quality gates and the
    # end-to-end tests and got a version; reuses the artifact from quality.
    # Then tags the commit with the version quality built it as. Patch
    # versions get no GitHub release; bundled releases come from release.yml.
    needs: [quality, e2e]
    if: needs.quality.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      # Push the version tag.
      contents: write
    # Serialise deploys, and never cancel one that has started. Uncontended
    # while main runs serialise at the workflow level; kept as a safeguard.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version tag
        # Before deploying: the version must be free or already on this commit.
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            # Expected on a re-run; on another commit the version was reused.
            git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists on another commit"
              exit 1
            fi
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Tag
        # Idempotent, so a re-run finishes what a failed attempt started. Tags
        # pushed with the GITHUB_TOKEN trigger no workflows, so no loop.
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "WebGraphy $tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
