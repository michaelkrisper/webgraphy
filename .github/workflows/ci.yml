name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate e2e screenshot baselines (uploaded as the e2e-snapshots artifact, not committed)"
        type: boolean
        default: false

# Nothing by default; every job declares the least it needs.
permissions: {}

# A newer push to a PR supersedes the older run. Everything else (main, manual
# dispatches) gets a per-run group, so a deploy is never cancelled mid-flight.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `git describe` sees version tags (app version).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test (with coverage thresholds)
        run: npx vitest run --coverage
      - name: Build
        run: npm run build
      - name: Size budget
        # Operates on the build produced above; gzipped bytes, per entry plus
        # the PWA precache total.
        run: node scripts/size-check.mjs
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Runs in the pinned Playwright container, not on the bare runner: screenshot
  # baselines depend on the exact browser build, font set and rasteriser, and
  # the image fixes all three. Baselines are generated here and committed —
  # never generated on a developer machine. To refresh them, dispatch CI with
  # `update-snapshots` and commit the files from the e2e-snapshots artifact.
  #
  # Builds its own bundle rather than downloading quality's `dist`: needing
  # quality would start Playwright only after the coverage run, which costs
  # more wall time than the build it saves.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Must equal the exact @playwright/test version in package.json (pinned
      # without a caret); the step below fails fast when they drift, e.g. when
      # Dependabot bumps the package but cannot see this image tag.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      # The container runs as root but Actions sets HOME to a pwuser-owned
      # directory, which Firefox refuses to launch with.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Playwright package matches container image
        run: |
          pkg=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          img=$(sed -n 's|^ *image: mcr.microsoft.com/playwright:v\([^-]*\)-.*|\1|p' .github/workflows/ci.yml)
          if [ "$pkg" != "$img" ]; then
            echo "::error::@playwright/test is '$pkg' but the e2e container image is v$img; bump both to the same exact version."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: End-to-end and visual regression
        if: ${{ !inputs.update-snapshots }}
        run: npx playwright test
      - name: Regenerate screenshot baselines
        if: ${{ inputs.update-snapshots }}
        run: npx playwright test --update-snapshots=changed
      - name: Upload regenerated baselines
        if: ${{ always() && inputs.update-snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-snapshots
          path: e2e/**/*-snapshots/
          retention-days: 7
      - name: Upload report and any written snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/**/*-snapshots/
          retention-days: 7

  # Separate job so a noisy benchmark never blocks the deploy pipeline, and so
  # it runs concurrently with the quality gates rather than lengthening them.
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Benchmark hot path against the baseline
        # Normalised against control workloads measured in the same run, so
        # results survive the spread between runner classes. Fails the build
        # only here: CI has a dedicated runner, developer machines do not.
        run: npm run bench:check
      - name: Upload raw benchmark result
        # Lets a clean baseline be regenerated from a run on an idle runner,
        # without measuring on a contended developer machine.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: bench-result.json
          retention-days: 7

  deploy:
    # Only deploy a green build of main; reuses the artifact from quality.
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialise deploys, and never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
